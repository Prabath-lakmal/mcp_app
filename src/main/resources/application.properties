spring.application.name=mcp_app

server.port= 8081

#gemoni ai config
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model= gemini-3.6-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model= gemini-embedding-001

#logging config
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#mcp server config
spring.ai.mcp.client.stdio.servers-configuration=classpath:servers.json
spring.ai.mcp.client.request-timeout=180s